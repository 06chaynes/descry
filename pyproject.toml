[project]
name = "descry-codegraph"
version = "0.3.0"
description = "Codebase knowledge graph: polyglot indexer, semantic search, call-graph analysis"
requires-python = ">=3.11"
authors = [{name = "Christian Haynes"}]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
readme = "README.md"
keywords = ["codegraph", "code-analysis", "mcp", "knowledge-graph", "scip", "call-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["protobuf>=6.33.4"]

[project.urls]
Homepage = "https://github.com/06chaynes/descry"
Repository = "https://github.com/06chaynes/descry"
Issues = "https://github.com/06chaynes/descry/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=2",
    # CVE floors on mcp transitive deps (constraints carry to users).
    "pyjwt>=2.12.0",
    "python-multipart>=0.0.26",
]
web = ["starlette>=0.47.2", "uvicorn>=0.32.0"]
embeddings = [
    "sentence-transformers>=3.0.0",
    # The default model's architecture (qwen3) is unknown to older releases.
    "transformers>=4.51.0",
    "numpy>=1.24.0",
]
embeddinggemma-2 = [
    # google/embeddinggemma-2 is multimodal: its processor imports Pillow and
    # torchvision even when only text is embedded.
    "descry-codegraph[embeddings]",
    "sentence-transformers>=6.1.0",
    "pillow>=12.3.0",
    "torchvision",
]
all = ["descry-codegraph[mcp,web,embeddings]"]
dev = [
    "descry-codegraph[all]",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff==0.16.4",
    "httpx>=0.27.0",
    "pip-audit>=2.9.0",
    # CVE floor on a pytest transitive dep.
    "pygments>=2.20.0",
]

[project.scripts]
descry = "descry.cli:main"
descry-mcp = "descry.mcp_server:main"
descry-generate = "descry.generate:main"
descry-web = "descry.web.server:main"

[tool.ruff]
# protoc output — regenerating it discards any edit ruff makes here.
extend-exclude = ["src/descry/scip/pb2.py"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/descry"]
